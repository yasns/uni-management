<!DOCTYPE html>

<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://xmlns.jcp.org/jsf/html"
      xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
>

<h:head>
    <meta charset="UTF-8"/>
    <title>
        <ui:insert name="title">University Management</ui:insert>
    </title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous"/>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
            integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI"
            crossorigin="anonymous"></script>
</h:head>

<h:body>

    <header class="sticky-top">
        <ui:insert name="topnav">
            <nav class="navbar navbar-expand-lg bg-body-tertiary">
                <div class="container">
                    <h:link value="University Management" outcome="/index" styleClass="navbar-brand"/>
                    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                            aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                        <span class="navbar-toggler-icon"></span>
                    </button>
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav">
                            <li class="nav-item">
                                <h:link value="Students" outcome="/index"
                                        styleClass="nav-link #{facesContext.viewRoot.viewId == '/index.xhtml' ? 'active' : ''}"/>
                            </li>
                            <li class="nav-item">
                                <h:link value="Courses" outcome="/courses"
                                        styleClass="nav-link #{facesContext.viewRoot.viewId == '/courses.xhtml' ? 'active' : ''}"/>
                            </li>
                            <li class="nav-item">
                                <h:link value="Statistics" outcome="/statistics"
                                        styleClass="nav-link #{facesContext.viewRoot.viewId == '/statistics.xhtml' ? 'active' : ''}"/>
                            </li>
                        </ul>
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <h:link value="MyBatis" outcome="/mybatis/students"
                                        styleClass="nav-link #{facesContext.viewRoot.viewId == '/mybatis/students' ? 'active' : ''}"/>
                            </li>
                        </ul>
                    </div>
                </div>
            </nav>
        </ui:insert>
    </header>

    <div class="container pt-3">
        <ui:repeat value="#{alertBean.alerts}" var="alert">
            <div class="alert alert-#{alert.type.cssClass()} alert-dismissible fade show" role="alert">
                #{alert.message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
        </ui:repeat>
    </div>

    <main class="container py-3">
        <ui:insert name="content">
            Loading...
        </ui:insert>
    </main>
</h:body>

</html>
